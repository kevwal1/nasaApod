<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NASA Astronomy Picture of the Day</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      background: radial-gradient(circle at top left, #1f2933, #020617);
      color: #e5e7eb;
      min-height: 100vh;
    }
    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 2.25rem 1.5rem 2.75rem;
    }
    h1 {
      margin: 0 0 0.35rem;
      font-size: clamp(2rem, 3vw, 2.6rem);
      letter-spacing: 0.03em;
    }
    .date {
      color: #9ca3af;
      margin-bottom: 1rem;
      font-size: 0.95rem;
    }
    .panel {
      background: #020617;
      border-radius: 14px;
      padding: 1.25rem 1.35rem;
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.35);
    }
    .media {
      margin: 1rem 0 0.5rem;
      text-align: center;
    }
    img {
      max-width: 100%;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.35);
    }
    iframe {
      width: 100%;
      min-height: 400px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.8);
    }
    .explanation {
      line-height: 1.6;
      margin-top: 1.2rem;
      color: #d1d5db;
    }
    .error {
      color: #f87171;
      font-weight: 700;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>NASA Astronomy Picture of the Day</h1>
    <div class="panel">
      {% if error %}
        <div class="error">Error fetching APOD: {{ error }}</div>
      {% endif %}

      {% if data %}
        <div class="date">{{ data.date }} — {{ data.title }}</div>

        <div class="media">
          {% if data.media_type == "image" %}
            <img src="{{ data.url }}" alt="{{ data.title }}">
          {% elif data.media_type == "video" %}
            <iframe src="{{ data.url }}" allowfullscreen title="{{ data.title }}"></iframe>
          {% endif %}
        </div>

        <div class="explanation">
          {{ data.explanation }}
        </div>
      {% endif %}
      </div>
    </div>
</body>
</html>
