<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NASA Astronomy Picture of the Day</title>
  <link rel="stylesheet" href="/shared-style/portal-theme.css">
  <style>
    body { min-height: 100vh; }
    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 2.25rem 1.5rem 2.75rem;
    }
    h1 {
      margin: 0 0 0.35rem;
      font-size: clamp(2rem, 3vw, 2.6rem);
      letter-spacing: 0.03em;
    }
    .date {
      color: var(--portal-muted);
      margin-bottom: 1rem;
      font-size: 0.95rem;
    }
    .panel {
      padding: 1.25rem 1.35rem;
    }
    .media {
      margin: 1rem 0 0.5rem;
      text-align: center;
    }
    img {
      max-width: 100%;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.8);
    }
    iframe {
      width: 100%;
      min-height: 400px;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.8);
    }
    .explanation {
      line-height: 1.6;
      margin-top: 1.2rem;
      color: #d1d5db;
    }
    .error {
      color: var(--portal-danger);
      font-weight: 700;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body class="portal-theme-body">
  <div class="container">
    <h1>NASA Astronomy Picture of the Day</h1>
    <div class="panel portal-theme-panel">
      {% if error %}
        <div class="error" role="alert">{{ error }}</div>
      {% endif %}

      {% if data %}
        <div class="date">{{ data.date }} — {{ data.title }}</div>

        <div class="media">
          {% if data.media_type == "image" %}
            <img src="{{ data.url }}" alt="{{ data.title }}">
          {% elif data.media_type == "video" %}
            <iframe src="{{ data.url }}" allowfullscreen title="{{ data.title }}"></iframe>
          {% endif %}
        </div>

        <div class="explanation">
          {{ data.explanation }}
        </div>
      {% endif %}
      </div>
    </div>
</body>
</html>
