<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NASA Astronomy Picture of the Day</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 2rem; background:#050814; color:#f5f5f5; }
    .container { max-width: 960px; margin: 0 auto; }
    h1 { margin-bottom: 0.25rem; }
    .date { color:#9ca3af; margin-bottom: 1rem; }
    .media { margin: 1.5rem 0; text-align:center; }
    img { max-width: 100%; border-radius: 8px; box-shadow:0 10px 25px rgba(0,0,0,0.5); }
    iframe { width:100%; min-height:400px; border:none; border-radius:8px; box-shadow:0 10px 25px rgba(0,0,0,0.5); }
    .explanation { line-height:1.6; margin-top:1.5rem; color:#e5e7eb; }
    .error { color:#f87171; font-weight:bold; margin-top:1rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>NASA Astronomy Picture of the Day</h1>

    {% if error %}
      <div class="error">Error fetching APOD: {{ error }}</div>
    {% endif %}

    {% if data %}
      <div class="date">{{ data.date }} — {{ data.title }}</div>

      <div class="media">
        {% if data.media_type == "image" %}
          <img src="{{ data.url }}" alt="{{ data.title }}">
        {% elif data.media_type == "video" %}
          <iframe src="{{ data.url }}" allowfullscreen title="{{ data.title }}"></iframe>
        {% endif %}
      </div>

      <div class="explanation">
        {{ data.explanation }}
      </div>
    {% endif %}
  </div>
</body>
</html>
